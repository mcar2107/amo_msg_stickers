# Правило — парой: `no-node-api` для .ts и `no-node-api-tsx` для .tsx. Грамматики разные: generic-стрелку
# `<T>(…)` из .ts парсер TSX принимает за JSX.

# Типов Node в проекте нет (types: ["chrome"]), а локальный typecheck видит их транзитивно и
# пропускает: без правила нарушение всплывает только в CI.
id: no-node-api
language: typescript
severity: error
message: 'Node API в src/ и tests/ — бери Web API (CLAUDE.md, «Без Node API в TypeScript»)'
files:
  - src/**
  - tests/**
rule:
  any:
    - kind: identifier
      regex: ^(process|Buffer|__dirname|__filename|require)$
    - kind: string_fragment
      regex: '^node:'

---
