id: no-hex-color
valid:
  - "const anchor = document.querySelector('#add');"
  - "const hash = '#section';"
  - "const text = 'color';"
  - "const link = 'https://example.com/#add';"
invalid:
  - "const color = '#fff';"
  - "const cls = 'bg-[#fff] text-[#ff0000]/50';"
  - 'const attr = "fill=''#fff''";'
  - "const shadow = 'inset 0 0 0 1px #00000014';"
  - 'const style = `color: #ff0000`;'
