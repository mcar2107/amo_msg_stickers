version: 2
updates:
  - package-ecosystem: 'npm'
    directories:
      - '/'
      - '/docs'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '09:00'
      timezone: 'Europe/Moscow'
    # Неделя: за неё скомпрометированный релиз пакета обычно успевают отозвать.
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    assignees:
      - 'mcar2107'
    commit-message:
      prefix: 'chore(deps)'
      prefix-development: 'chore(deps-dev)'
    groups:
      eslint:
        patterns: ['eslint*', '@eslint/*', 'typescript-eslint', 'globals']
        update-types: ['minor', 'patch']
      runtime:
        dependency-type: 'production'
        update-types: ['minor', 'patch']
      # пакет, подходящий двум группам, Dependabot отдаёт не первой по порядку, а «более специфичной», и группа
      # по dependency-type для него специфичнее группы по шаблонам: без исключения пакеты eslint уходят сюда.
      # Шаблоны — те же, что у группы eslint
      dev-tools:
        dependency-type: 'development'
        exclude-patterns: ['eslint*', '@eslint/*', 'typescript-eslint', 'globals']
        update-types: ['minor', 'patch']
    ignore:
      # версия закреплена точной: апдейт требует `pnpm skills:update` в том же PR, вручную
      - dependency-name: '@fission-ai/openspec'
      - dependency-name: '*'
        update-types: ['version-update:semver-major']

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '09:00'
      timezone: 'Europe/Moscow'
    cooldown:
      default-days: 7
    assignees:
      - 'mcar2107'
    groups:
      actions:
        patterns: ['*']
