name: Окружение
description: Node и pnpm из .mise.toml — те же версии, что локально; зависимости корня и доки по их lockfile

runs:
  using: composite
  steps:
    # Только Node и pnpm: бинарные инструменты проверок ставит задание, которому они нужны.
    - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
      with:
        install_args: node pnpm

    - id: pnpm-store
      shell: bash
      run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.pnpm-store.outputs.path }}
        key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'docs/pnpm-lock.yaml') }}
        restore-keys: pnpm-store-${{ runner.os }}-

    # Хуки husky в CI не нужны: проверки идут отдельными job-ами.
    - shell: bash
      run: pnpm install --frozen-lockfile
      env:
        HUSKY: '0'

    # Дока — отдельный проект pnpm со своим lockfile. Ставится во всех заданиях: eslint и
    # typecheck проверяют её конфиг и без зависимостей упали бы на импорте vitepress.
    - shell: bash
      run: pnpm -C docs install --frozen-lockfile
