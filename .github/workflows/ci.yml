name: CI

on:
  pull_request:
    branches: [master]
  workflow_call:
    # Только токен встроенного бота и встроенный ключ KLIPY: остальные секреты репозитория
    # проверкам не нужны. Без них сборка выходит без встроенного токена и ключа.
    secrets:
      TELEGRAM_BOT_TOKEN:
        required: false
      KLIPY_API_KEY:
        required: false

permissions:
  contents: read

# В PR новый коммит отменяет прогон старого. Вне PR группа — по коммиту: в группе с
# общим ref GitHub держит лишь один ожидающий прогон и заменяет его новым, так что
# при серии мержей проверки — а с ними и релиз — промежуточного коммита отменились бы.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm lint:es
      # Упавший eslint не должен прятать ошибки prettier.
      - if: ${{ !cancelled() }}
        run: pnpm lint:format

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm typecheck

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm test

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      # Токен встроенного Telegram-бота и встроенный ключ KLIPY: сборка кладёт их в content
      # script и userscript. Секрета нет (PR из форка, Dependabot) — пустая строка, сборка
      # без встроенного бота и ключа.
      - run: pnpm build
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          KLIPY_API_KEY: ${{ secrets.KLIPY_API_KEY }}
      # Версия записана только в package.json, сборка вставляет её в manifest и заголовок
      # userscript. Проверяется собранный файл, а не build.mjs: в релиз уходит он.
      - name: Версия сборки
        run: |
          version=$(jq -r .version package.json)
          manifest=$(jq -r .version dist/extension/manifest.json)
          banner=$(sed -n 's|^// @version *||p' dist/amo-stickers.user.js)
          if [ "${manifest}" != "${version}" ] || [ "${banner}" != "${version}" ]; then
            echo "::error::Версия сборки расходится с package.json (${version}): manifest — ${manifest}, @version — ${banner}"
            exit 1
          fi
      # manifest.json — в корне архива: так его принимают «Загрузить распакованное»
      # после распаковки и Chrome Web Store.
      # Имя без версии: ссылка доки на архив последнего релиза не меняется от версии
      # к версии, а версия видна в теге релиза и в chrome://extensions.
      - name: Архив расширения
        run: |
          cd dist/extension
          zip -r ../amo-stickers.zip .
      - uses: actions/upload-artifact@v7
        with:
          name: build
          path: |
            dist/amo-stickers.zip
            dist/amo-stickers.user.js
          if-no-files-found: error

  # Та же команда, что собирает сайт в pages.yml: битая ссылка ловится в PR, до
  # публикации.
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm docs:build

  version:
    runs-on: ubuntu-latest
    steps:
      # Полная история — для версии package.json из базовой ветки.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # Только Node: скрипт без зависимостей, но импортирует .ts — нужен Node из .mise.toml.
      - uses: jdx/mise-action@v4
        with:
          install_args: node
      - if: ${{ github.event_name == 'pull_request' }}
        run: node scripts/check-version.mjs --base "origin/${{ github.base_ref }}"
      - if: ${{ github.event_name != 'pull_request' }}
        run: node scripts/check-version.mjs
