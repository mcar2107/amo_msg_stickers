name: CI

on:
  pull_request:
    branches: [master]
  workflow_call:
    # Только токен встроенного бота и встроенный ключ KLIPY: остальные секреты репозитория
    # проверкам не нужны. Без них сборка выходит без встроенного токена и ключа.
    secrets:
      TELEGRAM_BOT_TOKEN:
        required: false
      KLIPY_API_KEY:
        required: false

permissions:
  contents: read

# В PR новый коммит отменяет прогон старого. Вне PR группа — по коммиту: в группе с
# общим ref GitHub держит лишь один ожидающий прогон и заменяет его новым, так что
# при серии мержей проверки — а с ними и релиз — промежуточного коммита отменились бы.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # ast-grep и agnix ставит `mise x` из .mise.toml; agnix — из релиза на GitHub, токен — от
    # лимита анонимных запросов к API.
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm lint:es
      # Упавший шаг не должен прятать ошибки следующих.
      - if: ${{ !cancelled() }}
        run: pnpm lint:format
      - if: ${{ !cancelled() }}
        run: pnpm lint:knip
      - if: ${{ !cancelled() }}
        run: pnpm lint:sg
      - if: ${{ !cancelled() }}
        run: pnpm lint:agents

  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm typecheck

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm test

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      # Токен встроенного Telegram-бота и встроенный ключ KLIPY: сборка кладёт их в content
      # script и userscript. Секрета нет (PR из форка, Dependabot) — пустая строка, сборка
      # без встроенного бота и ключа.
      - run: pnpm build
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          KLIPY_API_KEY: ${{ secrets.KLIPY_API_KEY }}
      # Версия записана только в package.json, сборка вставляет её в manifest и заголовок
      # userscript. Проверяется собранный файл, а не build.mjs: в релиз уходит он.
      - name: Версия сборки
        run: |
          version=$(jq -r .version package.json)
          manifest=$(jq -r .version dist/extension/manifest.json)
          banner=$(sed -n 's|^// @version *||p' dist/amo-stickers.user.js)
          if [ "${manifest}" != "${version}" ] || [ "${banner}" != "${version}" ]; then
            echo "::error::Версия сборки расходится с package.json (${version}): manifest — ${manifest}, @version — ${banner}"
            exit 1
          fi
      # Бюджет размера собранных файлов — .size-limit.json.
      - run: pnpm size
      # manifest.json — в корне архива: так его принимают «Загрузить распакованное»
      # после распаковки и Chrome Web Store.
      # Имя без версии: ссылка доки на архив последнего релиза не меняется от версии
      # к версии, а версия видна в теге релиза и в chrome://extensions.
      - name: Архив расширения
        run: |
          cd dist/extension
          zip -r ../amo-stickers.zip .
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build
          path: |
            dist/amo-stickers.zip
            dist/amo-stickers.user.js
          if-no-files-found: error

  # Та же команда, что собирает сайт в pages.yml: битая ссылка ловится в PR, до
  # публикации.
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm docs:build

  version:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Полная история — для версии package.json из базовой ветки.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      # Только Node: скрипт без зависимостей, но импортирует .ts — нужен Node из .mise.toml.
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install_args: node
      - if: ${{ github.event_name == 'pull_request' }}
        run: node scripts/check-version.mjs --base "origin/${GITHUB_BASE_REF}"
      - if: ${{ github.event_name != 'pull_request' }}
        run: node scripts/check-version.mjs

  # Проверкам ниже нужен только свой бинарник из .mise.toml и pnpm для команды проверки —
  # без node_modules.
  actions:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install_args: node pnpm github:jdx/jactionlint shellcheck
      - run: pnpm lint:actions

  # Вся история, а не дифф PR: секрет в любом коммите уже опубликован.
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install_args: node pnpm betterleaks
      - run: pnpm lint:secrets

  deps:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install_args: node pnpm osv-scanner
      - run: pnpm lint:deps
