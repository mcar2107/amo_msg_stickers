name: Доска

# Встроенные workflows доски переводят карточку в In progress по привязанному PR, а ветка
# появляется раньше: здесь тот же статус ставится по созданию ветки задачи.
on:
  create:

permissions:
  contents: read

# Повторное событие той же ветки делает то же самое: старый прогон не нужен.
concurrency:
  group: board-${{ github.ref }}
  cancel-in-progress: true

jobs:
  in-progress:
    # Событие `create` приходит и на теги.
    if: ${{ github.event.ref_type == 'branch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Скрипт берётся из основной ветки, а не из созданной: `create` отдаёт шагу секрет, и
      # ветка с подменённым скриптом выполнила бы свой код с токеном доски.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.repository.default_branch }}

      # Только Node: скрипт без зависимостей, но импортирует .ts — нужен Node из .mise.toml.
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install_args: node

      # Токен прогона доской пользователя управлять не может, поэтому нужен свой — PAT со
      # scope `project`. Имя ветки — пользовательский ввод, поэтому уходит в окружение, а не
      # подставляется в команду. Без секрета скрипт пишет предупреждение и завершается.
      - run: node scripts/move-issue-in-progress.mjs
        env:
          BRANCH: ${{ github.ref_name }}
          GH_TOKEN: ${{ secrets.PROJECT_TOKEN }}
          BOARD_OWNER: mcar2107
          BOARD_NUMBER: '1'
