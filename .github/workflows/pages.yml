name: Pages

# Сайт описывает выпущенный продукт, поэтому публикуется за релизом, а не за каждым
# мержем: правка доки о ещё не выпущенном поведении ждёт релиза вместе с кодом. Сборку
# в PR проверяет задание docs в ci.yml той же командой.
on:
  # Вызов из release.yml за новым релизом: событие release от релиза, созданного
  # GITHUB_TOKEN, workflow не запускает.
  workflow_call:
  # Ручная публикация: правка доки о выпущенном поведении без нового релиза.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    # У workflow_dispatch нет фильтра веток: ручной запуск с другой ветки опубликовал бы
    # её доку. Пропуск сборки пропускает и деплой.
    if: ${{ github.ref == 'refs/heads/master' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm docs:build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs/.vitepress/dist

  # Упавшая сборка до деплоя не доходит — на Pages остаётся прежний сайт.
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    # Группа на деплое, а не на workflow: сборки двух прогонов идут параллельно, а
    # публикации — по одной. Идущая не отменяется: оборванный деплой оставил бы сайт в
    # неизвестном состоянии, а следующий всё равно опубликует свежую сборку.
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
