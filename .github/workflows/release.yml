name: Release

on:
  push:
    branches: [master]
  # Запасной путь, если push мержа не создал прогона: GitHub изредка теряет событие,
  # а перезапустить прогон, которого нет, нельзя.
  workflow_dispatch:

permissions:
  contents: read

# Группы concurrency нет намеренно: GitHub держит в группе лишь один ожидающий
# прогон и заменяет его новым — при серии мержей промежуточная версия осталась бы
# без релиза. Параллельные прогоны выпускают разные теги; «Latest» выставляет шаг
# после создания релиза.

jobs:
  ci:
    # У workflow_dispatch нет фильтра веток: ручной запуск с другой ветки выпустил бы
    # релиз из неё. Пропуск ci пропускает и release.
    if: ${{ github.ref == 'refs/heads/master' }}
    uses: ./.github/workflows/ci.yml
    # Вызванный workflow секретов не видит: без них релиз собрался бы без встроенного
    # Telegram-бота и ключа KLIPY. Передаются только они, а не все секреты репозитория.
    secrets:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      KLIPY_API_KEY: ${{ secrets.KLIPY_API_KEY }}

  release:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # Публикация в стор идёт за релизом этого коммита: созданным сейчас или прошлой
    # попыткой того же прогона, упавшей после создания тега, — иначе перезапуск такой
    # попытки потерял бы версию для стора. Тег на другом коммите — версия выпущена
    # прошлым прогоном и в стор отправлялась тогда же.
    outputs:
      released: ${{ steps.tag.outputs.exists == 'false' || steps.tag.outputs.sha == github.sha }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - id: version
        run: echo "version=$(jq -r .version package.json)" >> "$GITHUB_OUTPUT"

      # Проверяется тег, а не релиз: тег без релиза тоже значит «версия занята». Мерж
      # без подъёма версии — штатный исход: его PR войдёт в заметки следующего релиза,
      # поэтому это notice, а не предупреждение.
      - id: tag
        env:
          TAG: v${{ steps.version.outputs.version }}
        run: |
          sha=$(git ls-remote --tags origin "refs/tags/${TAG}" | cut -f1)
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"
          if [ -n "${sha}" ]; then
            echo "::notice::Версия ${TAG} уже выпущена — релиз не создаётся"
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      # Та же сборка, что прошла проверки в job-е build.
      - if: ${{ steps.tag.outputs.exists == 'false' }}
        uses: actions/download-artifact@v8
        with:
          name: build
          path: release

      - if: ${{ steps.tag.outputs.exists == 'false' }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ steps.version.outputs.version }}
        run: |
          gh release create "${TAG}" \
            --target "${GITHUB_SHA}" \
            --title "${TAG}" \
            --generate-notes \
            --latest=false \
            release/amo-stickers.zip \
            release/amo-stickers.user.js

      # «Latest» (на него ведёт README) — всегда наибольшая версия, а не последний
      # завершившийся прогон: параллельный прогон меньшей версии может закончиться
      # позже. Последний завершившийся прогон видит все релизы и ставит верный; теги без
      # релиза, черновики и пре-релизы в расчёт не идут — «Latest» им не поставить.
      - if: ${{ steps.tag.outputs.exists == 'false' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest=$(gh release list --exclude-drafts --exclude-pre-releases --limit 1000 \
            --json tagName --jq '.[].tagName' | sort -V | tail -n 1)
          gh release edit "${latest}" --latest

  # Отдельный job после релиза: его сбой виден красным в прогоне, а релиз на GitHub к
  # этому моменту уже выпущен. Упавший job перезапускается кнопкой «Re-run failed
  # jobs» — версию, которая в сторе уже на проверке или опубликована, скрипт второй
  # раз не загружает. Тот же workflow запускается и вручную.
  chrome-web-store:
    needs: release
    if: ${{ needs.release.outputs.released == 'true' }}
    uses: ./.github/workflows/chrome-web-store.yml
    with:
      tag: v${{ needs.release.outputs.version }}
    secrets: inherit

  # Дока публикуется только с релизом и из его коммита: сайт не описывает ещё не
  # выпущенное. Условие то же, что у стора, — перезапуск упавшей попытки того же прогона
  # публикует и доку. Вызванный workflow не получит прав больше, чем у этого job-а.
  pages:
    needs: release
    if: ${{ needs.release.outputs.released == 'true' }}
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
