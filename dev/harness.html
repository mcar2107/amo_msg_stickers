<!doctype html>
<html lang="ru" class="dark">
  <head>
    <meta charset="utf-8" />
    <title>amo stickers — стенд</title>
    <!-- CSS страницы web.amo.tm, сохранённый из DevTools (в git не лежит). Разметка ниже
     повторяет поле ввода со страницы; вставка файла и отправка замоканы. -->
    <link rel="stylesheet" href="amo.css" />
    <style>
      body {
        margin: 0;
        font-family: 'Helvetica Neue', arial, sans-serif;
      }
      #chat {
        position: absolute;
        inset: 0 0 70px;
        overflow-y: auto;
        padding: 16px;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      /* Мок ленты amo. Классы CSS-модулей amo — `<имя>-<хэш>`, на стенде хэш — `x`: селекторы
       amo stickers держатся за основу `[class*="<имя>-"]` и срабатывают на обоих. Размеры и
       правила ниже повторяют вёрстку ленты (design.md, «Разметка ленты»). */
      .container-x {
        --bubble: #fff;
        --bubble-image: linear-gradient(#fff, #f7f8fa);
        display: flex;
        flex-direction: column;
      }
      .container-x.is_outgoing-x {
        --bubble: #dbe7ff;
        --bubble-image: linear-gradient(#e6eeff, #d3e2ff);
      }
      .dark .container-x {
        --bubble: #2b2b2e;
        --bubble-image: none;
      }
      .dark .container-x.is_outgoing-x {
        --bubble: #3a3d52;
      }
      .inner-x {
        display: flex;
        align-items: flex-end;
        max-width: 100%;
      }
      .is_outgoing-x > .inner-x {
        flex-direction: row-reverse;
      }
      .message_tail-x {
        fill: var(--bubble);
      }
      .is_outgoing-x .message_tail-x {
        transform: scaleX(-1);
      }
      .message-x {
        position: relative;
        min-width: 0;
        max-width: calc(100% - 64px);
        background-color: var(--bubble);
        background-image: var(--bubble-image);
      }
      .dark .message-x {
        color: #eee;
      }
      .photo_media_container-x {
        justify-content: center;
        align-items: center;
        width: 100%;
        min-width: 100px;
        max-width: 100%;
        min-height: 100px;
        display: flex;
        overflow: hidden;
        isolation: isolate;
      }
      .message_photo_media-x {
        border-radius: 7px;
      }
      .photo_media_image-x {
        object-fit: contain;
        max-width: 100%;
        height: auto;
      }
      .message_with_user-x:not(.message_with_reply-x) .media_wrapper_photo-x {
        margin-top: 0.25rem;
      }
      .blur-x {
        width: 100%;
        height: 100%;
        filter: blur(12px);
      }
      .time-x {
        padding: 0 5px;
        border-radius: 9px;
        background: rgba(0, 0, 0, 0.45);
        color: #fff;
        font-size: 11px;
        line-height: 18px;
      }
      .avatar-x {
        width: 40px;
        height: 40px;
        border-radius: 50%;
        background: #7b8cde;
      }
      .quote-x {
        display: flex;
        gap: 6px;
        align-items: center;
        padding-left: 6px;
        border-left: 2px solid #4a6cf7;
        font-size: 12px;
      }
      .reply-bar-x {
        display: flex;
        gap: 8px;
        align-items: center;
        padding: 8px 14px 0;
      }
      .reply-bar-x[hidden] {
        display: none;
      }
      /* Заглушка картинки, пока файл «скачивается»: заливка со спиннером и сплошной блок подложки,
       как у amo (design.md change loading-sticker-no-bubble, «Context»). */
      .placeholder-x {
        background: #d9dce1;
      }
      .dark .placeholder-x {
        background: #3a3a3d;
      }
      .loader-x {
        width: 14px;
        height: 14px;
        border: 2px solid #7a828e;
        border-top-color: transparent;
        border-radius: 50%;
        animation: loader-x 0.8s linear infinite;
      }
      @keyframes loader-x {
        to {
          transform: rotate(1turn);
        }
      }
      .backdrop-fill-x {
        width: 100%;
        height: 100%;
        background: #000;
      }
      .quote-x img {
        width: 46px;
        height: 46px;
        object-fit: cover;
        border-radius: 4px;
      }
      #tools {
        --tools-bg: rgb(255, 255, 255);
        --tools-fg: #2b2f36;
        --tools-muted: #7a828e;
        --tools-line: rgba(0, 0, 0, 0.12);
        --tools-hover: rgba(0, 0, 0, 0.06);
        --tools-accent: #3d6cf4;
        position: fixed;
        top: 8px;
        left: 8px;
        z-index: 5;
        display: flex;
        flex-direction: column;
        gap: 6px;
        max-width: 300px;
        padding: 8px;
        border: 1px solid var(--tools-line);
        border-radius: 10px;
        background: var(--tools-bg);
        color: var(--tools-fg);
        font:
          12px/16px 'Helvetica Neue',
          arial,
          sans-serif;
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.18);
        will-change: transform;
      }
      .dark #tools {
        --tools-bg: rgb(38, 38, 38);
        --tools-fg: #ececec;
        --tools-muted: #8d8d8d;
        --tools-line: rgba(255, 255, 255, 0.14);
        --tools-hover: rgba(255, 255, 255, 0.08);
        --tools-accent: #f3cf9e;
      }
      #tools-handle {
        margin: -2px -2px 0;
        padding: 2px 4px 6px;
        border-bottom: 1px solid var(--tools-line);
        color: var(--tools-muted);
        font-size: 11px;
        letter-spacing: 0.04em;
        cursor: grab;
        user-select: none;
        touch-action: none;
      }
      #tools.is-dragging #tools-handle {
        cursor: grabbing;
      }
      #tools.is-dragging * {
        transition: none;
      }
      #tools .group {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 4px;
      }
      #tools .group + .group {
        padding-top: 6px;
        border-top: 1px solid var(--tools-line);
      }
      #tools .group-title {
        width: 100%;
        color: var(--tools-muted);
        font-size: 10px;
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }
      #tools button,
      #tools select,
      #tools .toggle {
        box-sizing: border-box;
        height: 26px;
        padding: 0 10px;
        border: 1px solid var(--tools-line);
        border-radius: 6px;
        background: transparent;
        color: inherit;
        font: inherit;
        cursor: pointer;
        transition: background-color 0.12s;
      }
      #tools button:hover,
      #tools select:hover,
      #tools .toggle:hover {
        background: var(--tools-hover);
      }
      #tools .toggle {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 0 8px;
        user-select: none;
      }
      #tools .toggle input {
        margin: 0;
        accent-color: var(--tools-accent);
      }
      #tools .toggle:has(input:checked) {
        border-color: var(--tools-accent);
      }
      #tools .toggle select {
        height: 20px;
        padding: 0 2px;
        border: 0;
        background-color: transparent;
        color: var(--tools-fg);
        -webkit-text-fill-color: var(--tools-fg);
        appearance: auto;
      }
      #tools .toggle select option {
        background: var(--tools-bg);
        color: var(--tools-fg);
      }
      #tools [hidden] {
        display: none;
      }
      #tools output {
        width: 100%;
        color: var(--tools-muted);
        overflow-wrap: anywhere;
      }
      /* Worker-версия amo web: токены страницы — CSS-переменные; тёмная тема — по
       `data-amo-theme` на <html>, без него — по системе. `--amo-*` — переменные страницы, которые
       читает стиль ленты amo stickers, `--hw-*` — стенда. Всё — только под `.harness-worker`:
       прежние разметки этих переменных и классов не видят. */
      body.harness-worker {
        --amo-color-bubble-in-from: #ffffff;
        --amo-color-bubble-in-to: #f6f7f9;
        --amo-color-bubble-out-from: #e3ecff;
        --amo-color-bubble-out-to: #d2e0ff;
        --amo-radius-lgx: 10px;
        --amo-shadow-flat: 0 1px 2px rgba(16, 24, 40, 0.14);
        --hw-bg: #e9edf2;
        --hw-surface: #ffffff;
        --hw-fg: #1f2329;
        --hw-fg-muted: #8a919c;
        --hw-accent: #3d6cf4;
        --hw-line: rgba(0, 0, 0, 0.1);
        background: var(--hw-bg);
        color: var(--hw-fg);
      }
      [data-amo-theme='dark'] body.harness-worker {
        --amo-color-bubble-in-from: #2f3034;
        --amo-color-bubble-in-to: #2a2b2e;
        --amo-color-bubble-out-from: #44475c;
        --amo-color-bubble-out-to: #3a3d52;
        --amo-shadow-flat: 0 1px 2px rgba(0, 0, 0, 0.5);
        --hw-bg: #18181a;
        --hw-surface: #26272a;
        --hw-fg: #ececec;
        --hw-fg-muted: #8d8d8d;
        --hw-accent: #f3cf9e;
        --hw-line: rgba(255, 255, 255, 0.12);
      }
      [data-amo-theme='dark'] #tools {
        --tools-bg: rgb(38, 38, 38);
        --tools-fg: #ececec;
        --tools-muted: #8d8d8d;
        --tools-line: rgba(255, 255, 255, 0.14);
        --tools-hover: rgba(255, 255, 255, 0.08);
        --tools-accent: #f3cf9e;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-amo-theme]) body.harness-worker {
          --amo-color-bubble-in-from: #2f3034;
          --amo-color-bubble-in-to: #2a2b2e;
          --amo-color-bubble-out-from: #44475c;
          --amo-color-bubble-out-to: #3a3d52;
          --amo-shadow-flat: 0 1px 2px rgba(0, 0, 0, 0.5);
          --hw-bg: #18181a;
          --hw-surface: #26272a;
          --hw-fg: #ececec;
          --hw-fg-muted: #8d8d8d;
          --hw-accent: #f3cf9e;
          --hw-line: rgba(255, 255, 255, 0.12);
        }
        :root:not([data-amo-theme]) .harness-worker #tools {
          --tools-bg: rgb(38, 38, 38);
          --tools-fg: #ececec;
          --tools-muted: #8d8d8d;
          --tools-line: rgba(255, 255, 255, 0.14);
          --tools-hover: rgba(255, 255, 255, 0.08);
          --tools-accent: #f3cf9e;
        }
      }
      /* Классы страницы, которых нет в CSS прежней amo (`amo.css`): ими красится и кнопка
       стикеров, повторяющая кнопку эмодзи. */
      .harness-worker .text-fg-muted {
        color: var(--hw-fg-muted);
      }
      .harness-worker .text-accent {
        color: var(--hw-accent);
      }
      .harness-worker .hover\:text-accent:hover {
        color: var(--hw-accent);
      }
      .harness-worker .ease-base {
        transition-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
      }
      .harness-worker .isolate {
        isolation: isolate;
      }
      .harness-worker .grid {
        display: grid;
      }
      .harness-worker .invisible {
        visibility: hidden;
      }
      .harness-worker .rounded-capsule {
        border-radius: 21px;
      }
      .harness-worker .rounded-lgx {
        border-radius: var(--amo-radius-lgx);
      }
      .harness-worker .shadow-flat {
        box-shadow: var(--amo-shadow-flat);
      }
      .harness-worker .amo-bubble-in {
        background-image: linear-gradient(
          var(--amo-color-bubble-in-from),
          var(--amo-color-bubble-in-to)
        );
      }
      .harness-worker .amo-bubble-out {
        background-image: linear-gradient(
          var(--amo-color-bubble-out-from),
          var(--amo-color-bubble-out-to)
        );
      }
      .harness-worker button {
        padding: 0;
        border: 0;
        background: transparent;
        color: inherit;
        font: inherit;
      }
      .hw-column {
        position: relative;
        display: flex;
        flex-direction: column;
        height: 100vh;
      }
      .hw-header {
        position: relative;
        z-index: 20;
        display: flex;
        flex: none;
        align-items: center;
        justify-content: center;
        height: 57px;
        border-bottom: 1px solid var(--hw-line);
        background: var(--hw-surface);
        font-weight: 600;
      }
      .hw-feed {
        display: flex;
        flex: 1;
        flex-direction: column;
        gap: 4px;
        min-height: 0;
        padding: 16px 16px 150px;
        overflow-y: auto;
      }
      .hw-feed-buttons {
        position: absolute;
        right: 16px;
        bottom: 90px;
        z-index: 15;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .harness-worker .hw-feed-buttons button {
        width: 40px;
        height: 40px;
        border-radius: 50%;
        background: var(--hw-surface);
        color: var(--hw-fg-muted);
        box-shadow: var(--amo-shadow-flat);
        pointer-events: auto;
        cursor: pointer;
      }
      .hw-feed-row {
        display: flex;
      }
      .hw-wrapper {
        align-items: flex-end;
        max-width: 100%;
      }
      .hw-tail {
        flex: none;
        width: 8px;
        height: 10px;
        margin: 0 -1px;
        fill: var(--amo-color-bubble-in-to);
      }
      .flex-row-reverse > .hw-tail {
        transform: scaleX(-1);
        fill: var(--amo-color-bubble-out-to);
      }
      .hw-bubble {
        position: relative;
        min-width: 0;
        font-size: 14px;
        line-height: 18px;
      }
      .hw-media {
        position: relative;
        z-index: 10;
        display: flex;
        flex-wrap: wrap;
        align-items: flex-end;
      }
      .hw-box {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        width: 100%;
        max-width: 100%;
        overflow: hidden;
      }
      .hw-box-empty {
        background: var(--hw-line);
      }
      .hw-box > span {
        display: block;
        height: 0;
        max-width: 100%;
      }
      .hw-preview {
        position: absolute;
        inset: -48px;
        width: calc(100% + 96px);
        height: calc(100% + 96px);
        max-width: none;
        object-fit: cover;
        filter: blur(16px);
        pointer-events: none;
      }
      .hw-photo {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        max-width: none;
        object-fit: contain;
        pointer-events: none;
      }
      .hw-uploading {
        position: absolute;
        inset: 0;
        z-index: 10;
        display: flex;
        align-items: center;
        justify-content: center;
        max-width: 100%;
        margin: 0 auto;
        background: #7a828e;
        opacity: 0.5;
      }
      .hw-media-time {
        position: absolute;
        right: 4px;
        bottom: 4px;
        padding: 1px 6px;
        border-radius: var(--amo-radius-lgx);
        background: rgba(0, 0, 0, 0.45);
        color: #fff;
        font-size: 11px;
        line-height: 16px;
      }
      .hw-quote {
        display: flex;
        gap: 6px;
        align-items: center;
        margin-bottom: 6px;
        padding: 2px 6px;
        border-left: 2px solid var(--hw-accent);
        border-radius: 8px;
        font-size: 12px;
      }
      .hw-quote img {
        width: 36px;
        height: 36px;
        object-fit: cover;
        border-radius: 4px;
      }
      .hw-author,
      .hw-forward {
        display: block;
        margin-bottom: 4px;
        color: var(--hw-accent);
        font-size: 13px;
        font-weight: 600;
      }
      .hw-deleted {
        color: var(--hw-fg-muted);
        font-style: italic;
      }
      .hw-foot {
        display: flex;
        gap: 6px;
        align-items: center;
        justify-content: flex-end;
        margin-top: 2px;
        color: var(--hw-fg-muted);
        font-size: 11px;
      }
      .hw-foot:empty {
        display: none;
      }
      .hw-reaction {
        padding: 1px 6px;
        border-radius: 10px;
        background: var(--hw-line);
        color: var(--hw-fg);
        font-size: 12px;
      }
      .hw-avatar-spacer {
        flex: none;
        align-self: flex-end;
        width: 46px;
      }
      .hw-avatar {
        width: 36px;
        height: 36px;
        border-radius: 50%;
        background: #7b8cde;
      }
      .hw-controls {
        align-self: center;
        margin: 0 6px;
        color: var(--hw-fg-muted);
        opacity: 0;
        transition: opacity 0.12s;
      }
      .hw-wrapper:hover > .hw-controls {
        opacity: 1;
      }
      .hw-capsule {
        flex: 1;
        min-width: 0;
        background: var(--hw-surface);
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.14);
      }
      .hw-cell {
        flex: 1;
        min-width: 0;
        padding: 7px 0 7px 14px;
      }
      .hw-field,
      .hw-placeholder {
        grid-area: 1 / 1;
        font-size: 14px;
        line-height: 18px;
      }
      .hw-field {
        max-height: 200px;
        overflow-y: auto;
        outline: none;
      }
      .hw-placeholder {
        color: var(--hw-fg-muted);
        pointer-events: none;
      }
      .harness-worker .hw-round {
        display: flex;
        flex: none;
        align-items: center;
        align-self: flex-end;
        justify-content: center;
        width: 34px;
        height: 34px;
        border-radius: 50%;
        cursor: pointer;
        transition: opacity 0.3s;
      }
      .harness-worker .hw-send {
        margin-left: 6px;
        background: var(--hw-accent);
        color: var(--hw-surface);
      }
      .harness-worker .hw-cancel {
        margin-right: 6px;
        background: var(--hw-surface);
        color: var(--hw-fg-muted);
      }
      .hw-cancel[data-leaving] {
        opacity: 0;
      }
      .hw-reply {
        display: flex;
        gap: 8px;
        align-items: center;
        padding: 8px 14px 0;
        font-size: 13px;
      }
      [data-reply-leaving] {
        opacity: 0.4;
      }
      .hw-attachments {
        display: flex;
        gap: 6px;
        padding: 8px 12px 0;
      }
      .hw-attachments img {
        height: 48px;
        border-radius: 6px;
      }
      .hw-attachments[data-preparing] img {
        opacity: 0.5;
      }
      .hw-format {
        position: fixed;
        z-index: 1000;
        display: flex;
        gap: 4px;
        margin: 0;
        padding: 4px 8px;
        border-radius: 8px;
        background: var(--hw-surface);
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.2);
        list-style: none;
      }
      .hw-format[hidden] {
        display: none;
      }
      /* Панель стенда — над шапкой чата и медиа ленты Worker-версии, у которых свой `z-index`. */
      .harness-worker #tools {
        z-index: 25;
      }
      #attachments {
        display: flex;
        gap: 6px;
        padding: 8px 12px 0;
      }
      #attachments:empty {
        display: none;
      }
      #attachments img {
        height: 48px;
        border-radius: 6px;
      }
    </style>
  </head>
  <body class="bg-white-0 dark:bg-black-70">
    <div id="tools">
      <div id="tools-handle" title="Потяните, чтобы переместить">⠿ Стенд</div>
      <div class="group">
        <span class="group-title">Вид</span>
        <button id="theme">Тема</button>
        <label class="toggle">
          Язык amo
          <select id="locale">
            <option value="">авто</option>
            <option value="ru">ru</option>
            <option value="en">en</option>
          </select>
        </label>
        <label class="toggle">
          Разметка amo
          <select id="markup">
            <option value="legacy">прежняя</option>
            <option value="stable">стабильная</option>
            <option value="worker">Worker-версия</option>
          </select>
        </label>
      </div>
      <div class="group">
        <span class="group-title">Режим</span>
        <label class="toggle"
          ><input type="checkbox" id="queue" checked /> очередь amo</label
        >
        <label class="toggle"
          ><input type="checkbox" id="slow" /> медленная загрузка</label
        >
        <label class="toggle"
          ><input type="checkbox" id="slow-image" /> долгая загрузка картинки</label
        >
      </div>
      <div class="group">
        <span class="group-title">Сообщения</span>
        <label class="toggle"><input type="checkbox" id="incoming" /> входящее</label>
        <label class="toggle"
          ><input type="checkbox" id="author" /> с именем автора</label
        >
        <button id="plain">Картинка без метки</button>
        <button id="reply">Ответ с цитатой</button>
      </div>
      <div class="group">
        <span class="group-title">Ответ</span>
        <button id="reply-to">Ответить</button>
        <label class="toggle"
          ><input type="checkbox" id="reply-missing" /> сообщение ответа не
          загружено</label
        >
        <label class="toggle"
          ><input type="checkbox" id="slow-clear" /> медленное снятие ответа</label
        >
      </div>
      <div class="group" id="worker-tools" hidden>
        <span class="group-title">Worker-версия</span>
        <label class="toggle">
          Тема
          <select id="worker-theme">
            <option value="light">светлая</option>
            <option value="dark">тёмная</option>
            <option value="">система</option>
          </select>
        </label>
        <label class="toggle"
          ><input type="checkbox" id="core-missed" /> ядро не поймано</label
        >
        <label class="toggle"
          ><input type="checkbox" id="core-refuse" /> отказ ядра</label
        >
        <label class="toggle"><input type="checkbox" id="w-attachment" /> вложение</label>
        <label class="toggle"
          ><input type="checkbox" id="w-editing" /> редактирование</label
        >
        <label class="toggle"><input type="checkbox" id="w-reaction" /> реакция</label>
        <label class="toggle"><input type="checkbox" id="w-forward" /> пересылка</label>
        <button id="w-delete">Удалить последнее</button>
        <button id="w-history">История</button>
        <button id="w-reenter">Уйти и вернуться в чат</button>
        <output id="w-draft">черновик ядра: —</output>
      </div>
      <div class="group">
        <span class="group-title">Библиотека</span>
        <button id="library">20×120 паков</button>
      </div>
    </div>
    <div id="legacy-root" class="relative h-screen">
      <div id="chat"></div>
      <div class="absolute inset-x-0 bottom-0 translate-y-0">
        <div class="z-10 flex w-full flex-nowrap px-2.5 pb-1.5 pt-0">
          <div
            role="button"
            tabindex="-1"
            aria-label="cancel edit"
            class="ml-0 size-0 shrink-0 cursor-pointer self-end rounded-full bg-blue-50 fill-white-0 p-0 opacity-0 shadow-xxl outline-none duration-lg dark:bg-beige-70 dark:fill-black-70"
          ></div>
          <div class="w-full">
            <div
              class="relative flex flex-col bg-white-0 dark:bg-gray-10 rounded-[18px] shadow-lg"
            >
              <div id="attachments"></div>
              <div class="flex size-full">
                <div class="relative z-10 min-h-[17px] w-full px-3.5 pb-2 pt-[9px]">
                  <div
                    contenteditable="true"
                    role="textbox"
                    aria-placeholder="Написать сообщение"
                    data-placeholder="Написать сообщение..."
                    class="max-h-[225px] w-full overflow-hidden overflow-y-scroll p-0 pr-5 text-sm leading-4 text-gray-30 outline-none dark:text-gray-40"
                  ></div>
                </div>
                <div
                  class="relative z-100 mb-0 mr-3 flex h-full w-4.5 cursor-default items-end"
                >
                  <div class="flex h-8 items-center">
                    <svg
                      class="pointer-events-auto size-4.5 cursor-pointer fill-cadetGray-30 p-0 transition-all duration-base ease-linear dark:fill-gray-70"
                      width="18"
                      height="18"
                      viewBox="0 0 18 18"
                      xmlns="http://www.w3.org/2000/svg"
                    >
                      <path
                        d="M9 0C4.0364 0 0 4.03642 0 9C0 13.9636 4.0364 18 9 18C13.9636 18 18 13.9636 18 9C18 4.03642 13.9636 0 9 0V0ZM9 1.17391C13.3292 1.17391 16.8261 4.67084 16.8261 9C16.8261 13.3292 13.3292 16.8261 9 16.8261C4.67082 16.8261 1.17391 13.3292 1.17391 9C1.17391 4.67084 4.67082 1.17391 9 1.17391V1.17391ZM5.67391 5.28261C4.9175 5.28261 4.30435 5.89578 4.30435 6.65217C4.30435 7.40857 4.9175 8.02174 5.67391 8.02174C6.4303 8.02174 7.04348 7.40857 7.04348 6.65217C7.04348 5.89578 6.4303 5.28261 5.67391 5.28261ZM12.3261 5.28261C11.5697 5.28261 10.9565 5.89578 10.9565 6.65217C10.9565 7.40857 11.5697 8.02174 12.3261 8.02174C13.0825 8.02174 13.6957 7.40857 13.6957 6.65217C13.6957 5.89578 13.0825 5.28261 12.3261 5.28261ZM4.63451 10.7609C4.44592 10.7718 4.27375 10.8783 4.16984 11.0666C4.07078 11.2559 4.08414 11.4967 4.20652 11.6719C5.25573 13.2413 7.01345 14.2826 9 14.2826C10.9866 14.2826 12.7443 13.2413 13.7935 11.6719C13.9648 11.4158 13.8906 11.03 13.6345 10.8587C13.3784 10.6874 12.9865 10.7616 12.8152 11.0177C11.9678 12.2853 10.5786 13.1087 9 13.1087C7.42142 13.1087 6.03219 12.2853 5.18478 11.0177C5.02587 10.8312 4.8231 10.7499 4.63451 10.7609Z"
                      />
                    </svg>
                  </div>
                </div>
              </div>
            </div>
          </div>
          <div
            role="button"
            aria-label="Send message"
            tabindex="-1"
            class="ml-0 size-0 shrink-0 cursor-pointer self-end rounded-full bg-blue-50 fill-white-0 p-0 opacity-0 shadow-xxl outline-none dark:bg-beige-70 dark:fill-black-70 duration-lg"
          >
            <svg
              class="size-0"
              width="19"
              height="19"
              viewBox="0 0 19 19"
              xmlns="http://www.w3.org/2000/svg"
            >
              <path
                d="M0.583197 17.7245L2.10885 11.1177C2.16907 10.8366 2.40996 10.6157 2.71108 10.5755L11.2427 9.6919C11.4836 9.67182 11.4836 9.31035 11.2427 9.27019L2.71108 8.44685C2.40996 8.42676 2.16907 8.20587 2.10885 7.92473L0.583197 1.33798C0.442676 0.775692 1.04491 0.313817 1.56684 0.574877L18.2486 8.9288C18.7505 9.18986 18.7505 9.9128 18.2486 10.1739L1.56684 18.4876C1.04491 18.7487 0.442676 18.2868 0.583197 17.7245Z"
              />
            </svg>
          </div>
        </div>
      </div>
    </div>
    <script>
      /**
       * Разметка amo: стабильная — те же классы и структура плюс атрибуты `data-*`, которые новая
       * amo ставит для внешних скриптов; Worker-версия — своя разметка поля и ленты и ядро
       * страницы в Worker-е (скрипт ниже); выбор — с перезагрузкой, как язык.
       */
      const MARKUP_KEY = 'harness:markup';
      const MARKUPS = ['legacy', 'stable', 'worker'];
      const storedMarkup = localStorage.getItem(MARKUP_KEY);
      const markup = MARKUPS.includes(storedMarkup) ? storedMarkup : 'legacy';
      const isStableMarkup = markup === 'stable';
      const isWorkerMarkup = markup === 'worker';
      const markupSelect = document.getElementById('markup');
      markupSelect.value = markup;

      /**
       * `i18nextLng` у Worker-версии нет — он перебил бы `<html lang>`: на время Worker-версии
       * значение прежних разметок лежит под своим ключом стенда и возвращается при выходе из неё.
       */
      const LEGACY_LOCALE_KEY = 'harness:legacy-i18nextLng';
      const moveStored = (from, to) => {
        const value = localStorage.getItem(from);
        localStorage.removeItem(from);
        if (value !== null) localStorage.setItem(to, value);
      };
      markupSelect.onchange = () => {
        const isNextWorker = markupSelect.value === 'worker';
        if (isNextWorker && !isWorkerMarkup) moveStored(LOCALE_KEY, LEGACY_LOCALE_KEY);
        if (!isNextWorker && isWorkerMarkup) moveStored(LEGACY_LOCALE_KEY, LOCALE_KEY);
        localStorage.setItem(MARKUP_KEY, markupSelect.value);
        location.reload();
      };

      /**
       * Атрибуты стабильной разметки; в прежней — ничего. Булевы React пишет строкой "true",
       * ложные не пишет вовсе.
       */
      const mark = (node, attrs) => {
        if (!isStableMarkup) return node;
        for (const [name, value] of Object.entries(attrs)) {
          if (value === false || value === null || value === undefined) continue;
          node.setAttribute(name, value === true ? 'true' : String(value));
        }
        return node;
      };

      // --- мок amo: вставка файла + кнопка «Отправить» ---
      /**
       * Поиск — внутри корня прежних разметок: в Worker-версии его место занимает её колонка
       * чата, а мок прежних разметок работает на снятом из документа корне и странице не виден.
       */
      const legacyRoot = document.getElementById('legacy-root');
      const editable = legacyRoot.querySelector('[contenteditable]');
      const sendBtn = legacyRoot.querySelector('[aria-label="Send message"]');
      const attachments = legacyRoot.querySelector('#attachments');
      const chat = legacyRoot.querySelector('#chat');
      let files = [];

      const composeRow = editable.closest('.flex.size-full');
      mark(sendBtn.parentElement, { 'data-compose': true });
      mark(legacyRoot.querySelector('[aria-label="cancel edit"]'), {
        'data-compose-cancel-edit': true,
      });
      mark(composeRow.parentElement, { 'data-compose-field': true });
      mark(composeRow, { 'data-compose-row': true });
      mark(editable, { 'data-compose-input': true });
      mark(composeRow.querySelector(':scope > .z-100'), { 'data-compose-emoji': true });
      mark(sendBtn, { 'data-compose-send': true });

      function syncSend() {
        const visible = files.length > 0 || editable.textContent.trim().length > 0;
        ['size-8.5', 'opacity-100', 'ml-1.5', 'pl-2.5', 'pt-2', 'pb-0'].forEach((c) =>
          sendBtn.classList.toggle(c, visible)
        );
        sendBtn.querySelector('svg').classList.toggle('size-4.5', visible);
        if (isStableMarkup) sendBtn.toggleAttribute('data-visible', visible);
      }

      /**
       * «Медленная загрузка»: вложение и отправка через очередь ждут одинаково — 1,5 с.
       */
      const SLOW_DELAY_MS = 1500;
      const slowDelay = () =>
        document.getElementById('slow').checked
          ? new Promise((r) => setTimeout(r, SLOW_DELAY_MS))
          : Promise.resolve();

      editable.addEventListener('input', syncSend);
      editable.addEventListener('paste', async (e) => {
        const f = Array.from(e.clipboardData?.files || []);
        if (!f.length) return;
        e.preventDefault();
        await slowDelay();
        files.push(...f);
        attachments.replaceChildren(
          ...files.map((x) =>
            Object.assign(document.createElement('img'), { src: URL.createObjectURL(x) })
          )
        );
        syncSend();
        console.log(
          '[harness] attached',
          f.map((x) => `${x.name} ${x.type} ${x.size}b`)
        );
      });
      // --- мок ленты: разметка сообщения amo (design.md, «Разметка ленты») ---
      const MAX_MEDIA_SIDE = 420;
      let messageSeq = 0;
      let lastFile = null;

      /**
       * Сообщения ленты стенда по id — `state.messages` поддельного store; ответ — id
       * сообщения в черновике чата (`state.conversationDraughts`), плашка над полем — его вид.
       */
      const harnessMessages = {};
      let lastMessageId = null;
      let replyTo = null;

      const el = (tag, className, ...children) => {
        const node = document.createElement(tag);
        if (className) node.className = className;
        node.append(...children);
        return node;
      };

      const tail = () => {
        const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
        svg.setAttribute('class', 'message_tail-x');
        svg.setAttribute('width', '8');
        svg.setAttribute('height', '10');
        svg.setAttribute('viewBox', '0 0 8 10');
        svg.innerHTML = '<path d="M8 0v10H0C4 9 8 6 8 0Z" />';
        return mark(el('div', '-mx-1 w-2 h-2.5 overflow-hidden shrink-0', svg), {
          'data-feed-bubble-tail': true,
        });
      };

      /**
       * Корень сообщения: `is_outgoing` — исходящее; входящее в личном чате — корень без `is_*`.
       * «С именем автора» — заголовок группового чата: `message_with_user`, аватар, имя-кнопка.
       */
      const message = (content, { isReply = false, quote = null, meta = {} } = {}) => {
        const isIncoming = document.getElementById('incoming').checked;
        const hasAuthor = document.getElementById('author').checked;
        const root = el(
          'div',
          [
            'container-x',
            !isIncoming && 'is_outgoing-x',
            isReply && 'message_with_reply-x',
            hasAuthor && 'message_with_user-x',
          ]
            .filter(Boolean)
            .join(' ')
        );
        const id = `harness-${++messageSeq}`;
        root.id = `message+${id}`;
        mark(root, {
          'data-feed-message': true,
          'data-outgoing': !isIncoming,
          'data-with-reply': isReply,
          'data-with-author': hasAuthor,
        });
        harnessMessages[id] = {
          id,
          conversationId: HARNESS_CHAT_ID,
          conversationType: 'user',
          flags: [2],
          ...meta,
        };
        lastMessageId = id;
        const bubble = mark(
          el(
            'div',
            `message-x rounded-lgx p-2 shadow-md${hasAuthor ? ' has-title' : ''}`
          ),
          { 'data-feed-bubble': isIncoming ? 'default' : 'outgoing' }
        );
        if (hasAuthor)
          bubble.append(
            mark(
              el(
                'div',
                '',
                el('button', 'text-sm font-semibold', el('div', 'truncate', 'Собеседник'))
              ),
              { 'data-feed-author': true }
            )
          );
        if (quote) bubble.append(mark(quote, { 'data-feed-reply-quote': true }));
        bubble.append(
          mark(el('div', 'relative whitespace-pre-wrap', ...content), {
            'data-feed-content': true,
          })
        );
        const row = mark(el('div', 'inner-x', el('div', 'checkbox-x')), {
          'data-feed-row': true,
        });
        if (hasAuthor && isIncoming)
          row.append(
            mark(el('div', 'flex w-11.5 shrink-0 self-end', el('div', 'avatar-x')), {
              'data-feed-avatar': true,
            })
          );
        row.append(tail(), bubble);
        root.append(row);
        chat.append(root);
        chat.scrollTop = chat.scrollHeight;
        return root;
      };

      const loadImage = async (file) => {
        const img = new Image();
        img.src = URL.createObjectURL(file);
        await img.decode();
        return img;
      };

      /**
       * Скачивание файла картинки: из кэша amo — 0,1–0,2 с, «долгая загрузка картинки» — как
       * первое открытие чата на медленной сети.
       */
      const IMAGE_LOAD_MS = 150;
      const SLOW_IMAGE_LOAD_MS = 2000;

      /**
       * Место под картинку — как в amo: источник вписан в 420×420 без увеличения, размер —
       * inline-стилем контейнера над картинкой и атрибутами `width` / `height` у `img`. Пока
       * файл «скачивается», в контейнере — заливка со спиннером, а подложка — сплошной блок;
       * потом заливка сменяется `img`, блок — `canvas`. Стабильная разметка несёт имя файла и
       * размер контейнера на нём самом и в заглушке.
       */
      const sendMedia = async (file, name = file.name, quote = null) => {
        const source = await loadImage(file);
        const scale = Math.min(
          1,
          MAX_MEDIA_SIDE / source.naturalWidth,
          MAX_MEDIA_SIDE / source.naturalHeight
        );
        const width = Math.round(source.naturalWidth * scale);
        const height = Math.round(source.naturalHeight * scale);
        const placeholder = mark(
          el(
            'div',
            'absolute z-30 flex size-full items-center justify-center placeholder-x',
            el('div', 'loader-x')
          ),
          { 'data-photo-placeholder': true }
        );
        const place = mark(
          el('div', 'relative z-0 flex size-full overflow-hidden', placeholder),
          {
            'data-photo-frame': true,
            'data-file-name': name,
          }
        );
        place.style.width = `${width}px`;
        place.style.height = `${height}px`;
        if (isStableMarkup) {
          place.style.setProperty('--media-w', String(width));
          place.style.setProperty('--media-h', String(height));
        }
        const backdrop = mark(
          el('div', 'absolute -inset-1 -z-20', el('div', 'backdrop-fill-x')),
          { 'data-photo-backdrop': true }
        );
        const time = new Date().toTimeString().slice(0, 5);
        message(
          [
            mark(
              el(
                'div',
                'media_wrapper-x media_wrapper_photo-x -m-1',
                mark(
                  el(
                    'button',
                    'photo_media_container-x message_photo_media-x relative',
                    place,
                    backdrop
                  ),
                  { 'data-feed-photo': true }
                ),
                el('span', 'absolute right-1 bottom-1 h-4.5 time-x', `${time} ✓`)
              ),
              { 'data-feed-media': 'photo' }
            ),
          ],
          { isReply: Boolean(quote), quote, meta: { file, name } }
        );

        await new Promise((r) =>
          setTimeout(
            r,
            document.getElementById('slow-image').checked
              ? SLOW_IMAGE_LOAD_MS
              : IMAGE_LOAD_MS
          )
        );
        const img = el('img', 'photo_media_image-x size-full');
        Object.assign(img, { src: source.src, alt: name, width, height });
        placeholder.replaceWith(img);
        const canvas = el('canvas', 'blur-x');
        Object.assign(canvas, { width: 32, height: 32 });
        canvas.getContext('2d').drawImage(source, 0, 0, 32, 32);
        backdrop.replaceChildren(canvas);
      };

      const sendText = (text, quote = null) => {
        message([el('span', '', el('div', 'message-paragraph', text))], {
          isReply: Boolean(quote),
          quote,
          meta: { text },
        });
      };

      /**
       * Цитата ответа в пузыре — картинка сообщения или его текст.
       */
      const quoteOf = (record) => {
        const parts = [];
        if (record.file) {
          parts.push(
            Object.assign(document.createElement('img'), {
              src: URL.createObjectURL(record.file),
              alt: record.name,
            })
          );
        }
        parts.push(el('div', '', record.name || record.text || ''));
        return el('div', '-mx-1 -mt-2 mb-2', el('div', 'quote-x', ...parts));
      };

      // --- плашка ответа над полем: «ответить» ставит, «×» и отправка снимают ---
      const replyBar = el('div', 'reply-bar-x');
      const replyLabel = el('div', 'truncate text-sm');
      const replyClose = el('button', '', '×');
      replyBar.append(replyLabel, replyClose);
      replyBar.hidden = true;
      attachments.before(replyBar);

      const setReply = (id) => {
        replyTo = id;
        replyBar.hidden = !id;
        const record = id && harnessMessages[id];
        replyLabel.textContent = record ? `Ответ на: ${record.name || record.text}` : '';
      };
      replyClose.onclick = () => setReply(null);
      document.getElementById('reply-to').onclick = () => setReply(lastMessageId);

      /**
       * Сообщения, которые «загрузила страница»: с «сообщение ответа не загружено» — без
       * того, на которое отвечают.
       */
      const loadedMessages = () => {
        const loaded = { ...harnessMessages };
        if (replyTo && document.getElementById('reply-missing').checked)
          delete loaded[replyTo];
        return loaded;
      };

      sendBtn.addEventListener('click', async () => {
        const sent = files;
        const text = editable.textContent.trim();
        /**
         * Отправка из поля в amo уходит ответом и снимает плашку; сообщения ответа нет среди
         * загруженных — без цитаты.
         */
        const replied = replyTo && loadedMessages()[replyTo];
        const makeQuote = () => (replied ? quoteOf(replied) : null);
        setReply(null);
        console.log('[harness] sent', sent.length, 'files');
        files = [];
        attachments.replaceChildren();
        editable.textContent = '';
        syncSend();
        /**
         * Последний файл — до ожидания загрузки картинки: сообщение уже в ленте с заглушкой, и
         * «Ответ с цитатой» и «Картинка без метки» должны брать его, а не прежний.
         */
        for (const f of sent) {
          lastFile = { file: f, name: f.name };
          await sendMedia(f, f.name, makeQuote());
        }
        if (text) sendText(text, makeQuote());
      });

      /**
       * Поддельный провайдер amo (design.md change send-via-amo-queue, «Стенд»): агент в мире
       * страницы ищет `{ reduxStore, sendRequest }` по fiber от поля ввода. `sendRequest` кладёт
       * картинку сообщения в ленту, как amo после отправки, — с цитатой, если в сообщении
       * `refersTo`; поле ввода не трогается. `updateConversationDraughtRefersToId` снимает
       * плашку ответа, с «медленным снятием» — через секунду, как запрос, который доходит до
       * store не сразу.
       * «Очередь amo» выключена — провайдера нет, и стикер уходит запасным путём, вставкой.
       */
      const HARNESS_CHAT_ID = 'harness-chat';
      const amoClient = {
        reduxStore: {
          getState: () => ({
            location: {
              type: 'conversation',
              payload: {
                conversationType: 'direct',
                selectedConversationId: HARNESS_CHAT_ID,
              },
            },
            dialogs: {
              [HARNESS_CHAT_ID]: { id: HARNESS_CHAT_ID, conversationType: 'user' },
            },
            conversationDraughts: replyTo
              ? {
                  [HARNESS_CHAT_ID]: {
                    id: HARNESS_CHAT_ID,
                    refersTo: replyTo,
                    value: editable.textContent,
                  },
                }
              : {},
            messages: loadedMessages(),
          }),
        },
        sendRequest: async ({ type, payload }) => {
          console.log('[harness] sendRequest', type, payload);
          switch (type) {
            case 'sendNewMessages':
              for (const { media, refersTo } of payload.messages) {
                await slowDelay();
                lastFile = { file: media.file, name: media.fileName };
                await sendMedia(
                  media.file,
                  media.fileName,
                  refersTo ? quoteOf(refersTo) : null
                );
              }
              return undefined;
            case 'updateConversationDraughtRefersToId':
              if (document.getElementById('slow-clear').checked) {
                await new Promise((r) => setTimeout(r, 1000));
              }
              if (payload.refersToId === null) setReply(null);
              return undefined;
            default:
              return new Error(`unknown request ${type}`);
          }
        },
      };
      const syncQueue = () => {
        editable.__reactFiber$harness = document.getElementById('queue').checked
          ? {
              return: {
                return: null,
                alternate: null,
                memoizedProps: { value: amoClient },
              },
            }
          : undefined;
      };
      document.getElementById('queue').onchange = syncQueue;
      syncQueue();

      /**
       * Последняя отправленная «Отправить» картинка без метки в имени — сравнить размер GIF
       * со стикерами amo stickers. До первой отправки — сгенерированная картинка 480×270.
       */
      document.getElementById('plain').onclick = async () => {
        if (lastFile) {
          await sendMedia(lastFile.file, 'photo.gif');
          return;
        }
        const canvas = Object.assign(document.createElement('canvas'), {
          width: 480,
          height: 270,
        });
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#7b8cde';
        ctx.fillRect(0, 0, 480, 270);

            media && quoted.url ? h('img', { src: quoted.url, alt: '' }) : null,
            h('div', {}, media?.name || quoted?.row.text || t('Сообщение', 'Message'))
          );
        };

        const mediaNode = (entry) => {
          const { media, uploading } = entry.row;
          const box = pictureBox(media.w, media.h);
          const boxNode = h(
            'div',
            {
              'data-media': 'photo',
              'data-media-box': '',
              class: `hw-box${entry.preview ? '' : ' hw-box-empty'}`,
              style: { height: `${box.height}px`, borderRadius: `${MEDIA_BLEED_PX}px` },
            },
            h('span', { style: { width: `${box.width}px` } }),
            entry.preview &&
              h('img', {
                'data-media-preview': '',
                src: entry.preview,
                alt: '',
                class: 'hw-preview',
              }),
            entry.url &&
              h('img', {
                'data-media-photo': entry.isImageShown ? 'shown' : 'loading',
                src: entry.url,
                alt: '',
                class: `hw-photo${entry.isImageShown ? '' : ' invisible'}`,
              }),
            uploading &&
              h(
                'div',
                {
                  'data-media-uploading': '',
                  class: 'hw-uploading',
                  style: { width: `${box.width}px` },
                },
                h('div', { class: 'loader-x' })
              )
          );
          return h(
            'div',
            { class: 'hw-media' },
            boxNode,
            !entry.row.text &&
              h(
                'span',
                { 'data-media-time': 'over', class: 'hw-media-time' },
                `${entry.time} ✓`
              )
          );
        };

        const rowContent = (entry) => {
          const { row } = entry;
          const hasHead = Boolean(
            (row.author && !row.mine) || row.forwardedFrom || row.replyTo
          );
          const bubble = h('div', {
            'data-amo-bubble': '',
            class: `rounded-lgx p-2 shadow-flat ${row.mine ? 'amo-bubble-out' : 'amo-bubble-in'} hw-bubble`,
            style: row.media ? { maxWidth: 'min(422px, 65%)' } : null,
          });
          if (row.author && !row.mine) {
            bubble.append(
              h(
                'div',
                { 'data-amo-bubble-frame': '' },
                h('span', { 'data-author': '', class: 'hw-author' }, row.author)
              )
            );
          }
          if (row.forwardedFrom) {
            bubble.append(
              h(
                'div',
                { 'data-forward-from': '', class: 'hw-forward' },
                `${t('Переслано от', 'Forwarded from')} ${row.forwardedFrom}`
              )
            );
          }
          if (row.replyTo) bubble.append(quoteNode(row.replyTo));
          if (row.deleted) {
            bubble.append(
              h('div', { class: 'hw-deleted' }, t('Сообщение удалено', 'Message deleted'))
            );
          } else if (row.media) {
            const media = mediaNode(entry);
            media.style.margin = `${hasHead ? 4 : -MEDIA_BLEED_PX}px -${MEDIA_BLEED_PX}px ${row.text ? 6 : -MEDIA_BLEED_PX}px`;
            bubble.append(media);
          }
          if (row.text)
            bubble.append(h('div', { class: 'whitespace-pre-wrap' }, row.text));
          bubble.append(
            h(
              'div',
              { 'data-amo-bubble-foot': '', class: 'hw-foot' },
              ...row.reactions.map(({ emoji, count }) =>
                h('span', { class: 'hw-reaction' }, `${emoji} ${count}`)
              ),
              (!row.media || row.text || row.deleted) && h('span', {}, entry.time)
            )
          );
          const wrapper = h('div', {
            class: `relative flex${row.mine ? ' flex-row-reverse' : ''} hw-wrapper`,
          });
          if (row.author && !row.mine) {
            wrapper.append(
              h(
                'div',
                { class: 'hw-avatar-spacer' },
                h('div', { 'data-amo-pack-face': '', class: 'hw-avatar' })
              )
            );
          }
          wrapper.append(
            h(
              'div',
              { 'data-amo-tail': '', class: 'hw-tail' },
              icon(TAIL_D, { className: '', width: 8, height: 10 })
            ),
            bubble,
            h(
              'div',
              { class: 'amo-message-controls hw-controls' },
              h('button', { type: 'button', 'aria-label': t('Ответить', 'Reply') }, '↩')
            )
          );
          return h(
            'div',
            {
              'data-amo-feed-row': '',
              'data-amo-lead': '',
              'data-amo-tail': '',
              class: 'hw-feed-row',
              style: { justifyContent: row.mine ? 'flex-end' : 'flex-start' },
            },
            wrapper
          );
        };

        const rowNodeOf = (key) =>
          feed.querySelector(`:scope > [data-key="${CSS.escape(key)}"]`);

        /**
         * Строка ленты: узел `[data-key]` переживает перерисовку, его содержимое и пропсы
         * меняются в одной задаче — как коммит React.
         */
        const renderRow = (entry, { isPrepend = false } = {}) => {
          if (!isFeedMounted) return;
          const { key } = entry.row;
          let rowNode = rowNodeOf(key);
          const isNew = !rowNode;
          const shouldStick = isNew && !isPrepend && isAtBottom();
          if (isNew) rowNode = h('div', { 'data-key': key, class: 'amo-glides' });
          rowNode.replaceChildren(rowContent(entry));
          commitFiber(
            rowNode,
            { 'data-key': key, className: 'amo-glides' },
            { row: entry.row, chat: CHAT_ID },
            ROW_DEPTH
          );
          if (isNew && isPrepend) feed.prepend(rowNode);
          else if (isNew) feed.append(rowNode);
          if (shouldStick) feed.scrollTop = feed.scrollHeight;
          syncDown();
        };

        /**
         * Скачивание картинки: до него в коробке заглушка, картинка — `loading` и не видна.
         */
        const scheduleImage = (entry) => {
          if (!entry.url || entry.isImageShown || entry.isImageLoading) return;
          entry.isImageLoading = true;
          setTimeout(
            () => {
              entry.isImageLoading = false;
              entry.isImageShown = true;
              renderRow(entry);
            },
            isChecked('slow-image') ? SLOW_IMAGE_LOAD_MS : IMAGE_LOAD_MS
          );
        };

        const upsertRow = (row, bytes, { isPrepend = false } = {}) => {
          let entry = entries.get(row.key);
          if (!entry) {
            entry = {
              row,
              bytes: null,
              url: null,
              preview: null,
              isImageShown: false,
              isImageLoading: false,
              time: new Date().toTimeString().slice(0, 5),
            };
            entries.set(row.key, entry);
            if (isPrepend) order.unshift(row.key);
            else order.push(row.key);
          }
          entry.row = row;
          if (bytes && !entry.bytes) {
            entry.bytes = bytes;
            entry.url = URL.createObjectURL(bytes);
            makePreview(bytes).then((preview) => {
              entry.preview = preview;
              renderRow(entry);
            });
          }
          renderRow(entry, { isPrepend });
          scheduleImage(entry);
          return entry;
        };

        /**
         * Строка «с сервера» мимо ядра: история, картинка без метки, текстовый ответ.
         */
        const addServerRow = (fields, bytes, options) =>
          upsertRow(
            {
              key: `server-${++localKeySeq}`,
              mine: !isChecked('incoming'),
              author: isChecked('author') ? PEER : null,
              forwardedFrom: isChecked('w-forward') ? PEER : null,
              reactions: [],
              text: '',
              blocks: [],
              replyTo: null,
              media: null,
              uploading: false,
              deleted: false,
              ...fields,
            },
            bytes,
            options
          );

        const lastEntry = (isMatch) => {
          for (let index = order.length - 1; index >= 0; index--) {
            const entry = entries.get(order[index]);
            if (!entry.row.deleted && isMatch(entry)) return entry;
          }
          return null;
        };
        const lastMediaEntry = () => lastEntry((entry) => Boolean(entry.row.media));

        // --- полоса поля ---
        const EMOJI_CLASS =
          'z-20 mr-3 flex h-8 shrink-0 cursor-pointer items-center self-end transition-colors duration-base ease-base hover:text-accent';
        const SIDE_BUTTON_CLASS =
          'mr-3 flex h-8 shrink-0 cursor-pointer items-center self-end text-fg-muted';
        /**
         * Вложения и правка — состояние страницы; текст и ответ черновика — у ядра (`coreDraft` —
         * его последний доклад). Вложения готовятся: полоса вложений видна сразу, «Отправить» —
         * когда они готовы.
         */
        const compose = { edit: null, attachments: [], isPrepared: false };
        let coreDraft = { text: '', entities: [], reply: null };
        let composer = null;
        let prepareTimer = 0;

        const readDraft = (field) => {
          const walker = document.createTreeWalker(field, NodeFilter.SHOW_TEXT);
          let text = '';
          const entities = [];
          while (walker.nextNode()) {
            const { currentNode } = walker;
            const from = text.length;
            text += currentNode.data;
            if (!currentNode.parentElement.closest('b, strong')) continue;
            const last = entities.at(-1);
            if (last && last.to === from) last.to = text.length;
            else entities.push({ from, to: text.length, marks: MARK_BOLD });
          }
          return { text, entities };
        };
        const renderDraft = (field, { text, entities }) => {
          const parts = [];
          let at = 0;
          for (const { from, to } of entities) {
            if (from > at) parts.push(text.slice(at, from));
            parts.push(h('b', {}, text.slice(from, to)));
            at = to;
          }
          if (at < text.length) parts.push(text.slice(at));
          field.replaceChildren(...parts);
        };
        const draftLabel = ({ text, entities, reply }) => {
          let label = '';
          let at = 0;
          for (const { from, to } of entities) {
            label += `${text.slice(at, from)}**${text.slice(from, to)}**`;
            at = to;
          }
          label += text.slice(at);
          return `черновик ядра: ${label ? `«${label}»` : '—'}${reply ? ` · ответ на ${reply}` : ''}`;
        };

        const hasFieldText = () => composer.field.textContent.trim() !== '';

        const commitComposer = () => {
          const ownerProps = {
            chat: CHAT_ID,
            onSend: handleSendClick,
            onFilesPick: attachFiles,
            reply: coreDraft.reply ? { key: coreDraft.reply } : null,
            edit: compose.edit,
            attached: compose.attachments.length > 0,
            draft: { text: coreDraft.text, entities: coreDraft.entities },
            onDraftChange: (draft) =>
              postCore({ kind: 'draft', chat: CHAT_ID, ...draft }),
          };
          commitFiber(
            composer.field,
            { contentEditable: true, role: 'textbox', 'aria-multiline': true },
            ownerProps,
            COMPOSE_DEPTH
          );
        };

        const leave = (node, attr) => {
          node.setAttribute(attr, '');
          setTimeout(() => node.remove(), LEAVE_MS);
        };

        const syncComposer = () => {
          if (!composer) return;
          const c = composer;
          const isEditing = Boolean(compose.edit);
          const hasAttachments = compose.attachments.length > 0;

          if (isEditing && !c.cancel) {
            c.cancel = h(
              'button',
              {
                type: 'button',
                'data-compose-edit-cancel': '',
                'aria-label': t('Отменить редактирование', 'Cancel editing'),
                class: 'hw-round hw-cancel',
              },
              '×'
            );
            c.cancel.onclick = () => setEditing(false);
            c.capsule.before(c.cancel);
          }
          if (!isEditing && c.cancel) {
            leave(c.cancel, 'data-leaving');
            c.cancel = null;
          }
          c.capsule.toggleAttribute('data-editing', isEditing);

          const replyEntry = coreDraft.reply && entries.get(coreDraft.reply);
          const replyText = `${t('Ответ на', 'Reply to')}: ${replyEntry?.row.media?.name || replyEntry?.row.text || coreDraft.reply}`;
          if (coreDraft.reply && !c.replySlot) {
            const close = h(
              'button',
              { type: 'button', 'aria-label': t('Отменить ответ', 'Cancel reply') },
              '×'
            );
            close.onclick = () => postCore({ kind: 'reply', chat: CHAT_ID, key: null });
            c.replyLabel = h('div', { class: 'truncate' }, replyText);
            c.replySlot = h(
              'div',
              { 'data-reply-slot': '', 'data-compose-slot': '' },
              h(
                'div',
                { 'data-reply-plate': '', class: 'amo-reply-plate hw-reply' },
                c.replyLabel,
                close
              )
            );
            c.fill.after(c.replySlot);
          } else if (coreDraft.reply) {
            c.replyLabel.textContent = replyText;
          } else if (c.replySlot) {
            leave(c.replySlot, 'data-reply-leaving');
            c.replySlot = null;
          }

          if (hasAttachments) {
            if (!c.attachmentsSlot) {
              c.attachmentsStrip = h('div', {
                'data-attachments': '',
                class: 'hw-attachments',
              });
              c.attachmentsSlot = h(
                'div',
                { 'data-attachments-slot': '' },
                c.attachmentsStrip
              );
              c.row.before(c.attachmentsSlot);
            }
            c.attachmentsStrip.toggleAttribute('data-preparing', !compose.isPrepared);
            c.attachmentsStrip.replaceChildren(
              ...compose.attachments.map(({ url }) => h('img', { src: url, alt: '' }))
            );
          } else if (c.attachmentsSlot) {
            c.attachmentsSlot.remove();
            c.attachmentsSlot = null;
          }

          const hasClip = !isEditing && !hasAttachments;
          if (hasClip && !c.clip) {
            const input = h('input', { type: 'file', multiple: true, hidden: true });
            input.onchange = () => {
              attachFiles([...input.files]);
              input.value = '';
            };
            c.clip = h(
              'label',
              {
                'data-compose-clip': '',
                'aria-label': t('Прикрепить файл', 'Attach file'),
                class: SIDE_BUTTON_CLASS,
              },
              icon(CLIP_D, { isStroke: true }),
              input
            );
            c.row.prepend(c.clip);
          }
          if (!hasClip && c.clip) {
            c.clip.remove();
            c.clip = null;
          }

          const isSendable = hasFieldText() || (hasAttachments && compose.isPrepared);
          if (isSendable && !c.send) {
            c.send = h(
              'button',
              {
                type: 'button',
                'aria-label': t('Отправить', 'Send'),
                class: 'hw-round hw-send',
              },
              icon(SEND_D)
            );
            c.send.onclick = handleSendClick;
            c.capsule.after(c.send);
          }
          if (!isSendable && c.send) {
            c.send.remove();
            c.send = null;
          }
          c.placeholder.hidden = hasFieldText();
          commitComposer();
        };

        /**
         * Как у страницы: обработчик ввода читает `inputType` и после чтения поля шлёт черновик
         * ядру командой `draft` — синхронно. Событие без `inputType` он не переживает, и черновик
         * не уходит. При правке сообщения поле — текст сообщения, а не черновик.
         */
        const handleFieldInput = (event) => {
          if (typeof event.inputType !== 'string')
            throw new TypeError('input без inputType');
          if (!compose.edit)
            postCore({ kind: 'draft', chat: CHAT_ID, ...readDraft(composer.field) });
          syncComposer();
        };

        /**
         * Вставка: файлы из буфера важнее текста и уходят во вложения; без файлов — только текст.
         */
        const handleFieldPaste = (event) => {
          event.preventDefault();
          const files = [...(event.clipboardData?.files || [])];
          if (files.length) {
            attachFiles(files);
            return;
          }
          document.execCommand(
            'insertText',
            false,
            event.clipboardData?.getData('text/plain') || ''
          );
        };

        const syncToolbar = () => {
          if (!composer) return;
          const selection = document.getSelection();
          const isInField =
            selection &&
            !selection.isCollapsed &&
            composer.field.contains(selection.anchorNode);
          composer.toolbar.hidden = !isInField;
          if (!isInField) return;
          const rect = selection.getRangeAt(0).getBoundingClientRect();
          composer.toolbar.style.left = `${rect.left}px`;
          composer.toolbar.style.top = `${rect.top - 40}px`;
        };
        document.addEventListener('selectionchange', syncToolbar);

        const mountComposer = () => {
          const placeholderText = t('Написать сообщение', 'Write a message');
          const field = h('div', {
            contenteditable: 'true',
            role: 'textbox',
            'aria-multiline': 'true',
            'aria-label': placeholderText,
            class: 'hw-field',
          });
          const placeholder = h(
            'span',
            { 'data-compose-placeholder': '', class: 'hw-placeholder' },
            placeholderText
          );
          const emoji = h(
            'button',
            {
              type: 'button',
              'aria-label': t('Смайлик', 'Emoji'),
              'aria-haspopup': 'dialog',
              'aria-expanded': 'false',
              class: `${EMOJI_CLASS} text-fg-muted`,
            },
            icon(SMILE_D)
          );
          emoji.addEventListener('mousedown', (event) => event.preventDefault());
          emoji.onclick = () => {
            const isOpen = emoji.getAttribute('aria-expanded') !== 'true';
            emoji.setAttribute('aria-expanded', String(isOpen));
            emoji.className = `${EMOJI_CLASS} ${isOpen ? 'text-accent' : 'text-fg-muted'}`;
          };
          const mic = h(
            'button',
            {
              type: 'button',
              'aria-label': t('Голосовое сообщение', 'Voice message'),
              class: SIDE_BUTTON_CLASS,
            },
            icon(MIC_D, { isStroke: true })
          );
          const row = h(
            'div',
            { class: 'flex min-w-0 grow' },
            h('div', { class: 'relative z-10 grid hw-cell' }, field, placeholder),
            emoji,
            mic
          );
          const fill = h(
            'div',
            { class: 'amo-capsule-fill' },
            h('div', { 'data-capsule-top': '' })
          );
          const capsule = h(
            'div',
            { class: 'relative isolate flex flex-col rounded-capsule hw-capsule' },
            fill,
            row
          );
          const bold = h(
            'button',
            { type: 'button', 'aria-label': t('Жирный', 'Bold') },
            h('b', {}, 'B')
          );
          bold.addEventListener('mousedown', (event) => event.preventDefault());
          bold.onclick = () => document.execCommand('bold');
          const toolbar = h(
            'ul',
            { class: 'hw-format', hidden: true },
            h('li', {}, bold)
          );
          bar.replaceChildren(capsule, toolbar);
          composer = {
            field,
            placeholder,
            row,
            fill,
            capsule,
            toolbar,
            cancel: null,
            clip: null,
            send: null,
            replySlot: null,
            replyLabel: null,
            attachmentsSlot: null,
            attachmentsStrip: null,
          };

          field.addEventListener('input', handleFieldInput);
          field.addEventListener('paste', handleFieldPaste);
          field.addEventListener('keydown', (event) => {
            if (event.key !== 'Enter' || event.shiftKey) return;
            event.preventDefault();
            handleSendClick();
          });
          renderDraft(field, coreDraft);
          syncComposer();
        };

        const attachFiles = (files) => {
          compose.attachments.push(
            ...files.map((file) => ({ file, url: URL.createObjectURL(file) }))
          );
          compose.isPrepared = false;
          $('w-attachment').checked = true;
          startPhotoWorker(PHOTO_SIDES);
          syncComposer();
          clearTimeout(prepareTimer);
          prepareTimer = setTimeout(
            () => {
              compose.isPrepared = true;
              syncComposer();
            },
            isChecked('slow') ? SLOW_DELAY_MS : PREPARE_MS
          );
        };
        const clearAttachments = () => {
          clearTimeout(prepareTimer);
          compose.attachments = [];
          compose.isPrepared = false;
          $('w-attachment').checked = false;
          syncComposer();
        };

        /**
         * Картинка-образец: эллипс на прозрачном или залитом фоне с подписью сторон.
         */
        const drawSample = ({ width, height }, fill = 'transparent') => {
          const canvas = new OffscreenCanvas(width, height);
          const ctx = canvas.getContext('2d');
          const side = Math.min(width, height);
          ctx.fillStyle = fill;
          ctx.fillRect(0, 0, width, height);
          ctx.fillStyle = `hsl(${(width * 7 + height * 3) % 360} 70% 60%)`;
          ctx.beginPath();
          ctx.ellipse(
            width / 2,
            height / 2,
            width * 0.45,
            height * 0.45,
            0,
            0,
            Math.PI * 2
          );
          ctx.fill();
          ctx.fillStyle = '#000';
          ctx.font = `bold ${Math.round(side / 6)}px sans-serif`;
          ctx.textAlign = 'center';
          ctx.fillText(`${width}×${height}`, width / 2, height / 2 + side / 18);
          return canvas.convertToBlob({ type: 'image/png' });
        };
        const PHOTO_FILL = '#7b8cde';

        /**
         * Своя отправка страницы: файлы — `sendFiles` со своим `seq` от 1, текст — `sendMessage`;
         * по докладу `sent` со своим `seq` страница ведёт ленту к низу.
         */
        const sendOwn = async (files, draft) => {
          const seq = ownSeq++;
          ownSeqs.add(seq);
          if (!files.length) {
            postCore({ kind: 'sendMessage', chat: CHAT_ID, seq, ...draft });
            return;
          }
          const described = await Promise.all(
            files.map(async (file, index) => {
              const bitmap = await createImageBitmap(file);
              const { width, height } = bitmap;
              bitmap.close();
              return {
                file: `harness-${seq}-${index}`,
                bytes: file,
                kind: 'photo',
                name: file.name,
                mime: file.type,
                size: file.size,
                w: width,
                h: height,
                durationMs: 0,
              };
            })
          );
          postCore({
            kind: 'sendFiles',
            chat: CHAT_ID,
            text: draft.text,
            seq,
            files: described,
          });
        };

        const handleSendClick = () => {
          if (!composer.send) return;
          if (compose.edit) {
            setEditing(false);
            return;
          }
          const draft = readDraft(composer.field);
          const files = compose.attachments.map(({ file }) => file);
          composer.field.replaceChildren();
          clearAttachments();
          sendOwn(files, draft);
        };

        const setEditing = (isOn) => {
          $('w-editing').checked = isOn;
          if (isOn) {
            const target = lastEntry(
              (entry) => entry.row.mine && Boolean(entry.row.text)
            );
            compose.edit = { key: target?.row.key || null };
            renderDraft(composer.field, {
              text: target?.row.text || t('Редактируемое сообщение', 'Edited message'),
              entities: [],
            });
          } else {
            compose.edit = null;
            renderDraft(composer.field, coreDraft);
          }
          syncComposer();
        };

        // --- доклады ядра ---
        const handleReport = ({ data }) => {
          switch (data?.kind) {
            case 'draftState':
              if (data.chat !== CHAT_ID) return;
              coreDraft = data.draft;
              $('w-draft').textContent = draftLabel(coreDraft);
              syncComposer();
              return;
            case 'row': {
              if (data.chat !== CHAT_ID) return;
              const { bytes, ...media } = data.row.media || {};
              upsertRow({ ...data.row, media: data.row.media ? media : null }, bytes);
              return;
            }
            case 'sent':
              if (!ownSeqs.delete(data.seq)) return;
              if (data.key) scrollToBottom();
              else console.warn('[harness] своя отправка отклонена', data.refused);
              return;
            default:
              return;
          }
        };

        const startCore = () => {
          if (core) return;
          core = new Worker(coreUrl, { type: 'module', name: CORE_NAME });
          core.onmessage = handleReport;
          sendConfig();
          console.log('[harness] ядро страницы создано');
        };

        // --- переключатели ---
        const coreMissed = $('core-missed');
        coreMissed.checked = localStorage.getItem(CORE_MISSED_KEY) === 'true';
        coreMissed.onchange = () => {
          localStorage.setItem(CORE_MISSED_KEY, String(coreMissed.checked));
          location.reload();
        };
        for (const id of ['slow', 'core-refuse', 'incoming', 'author', 'w-forward']) {
          $(id).addEventListener('change', sendConfig);
        }

        $('w-attachment').onchange = async () => {
          if (!isChecked('w-attachment')) {
            clearAttachments();
            return;
          }
          const blob = await drawSample(PHOTO_SIDES, PHOTO_FILL);
          attachFiles([new File([blob], 'photo.png', { type: 'image/png' })]);
        };
        $('w-editing').onchange = () => setEditing(isChecked('w-editing'));

        let reactedKey = null;
        $('w-reaction').onchange = () => {
          const entry = isChecked('w-reaction')
            ? lastMediaEntry() || lastEntry(() => true)
            : entries.get(reactedKey);
          if (!entry) {
            $('w-reaction').checked = false;
            return;
          }
          reactedKey = isChecked('w-reaction') ? entry.row.key : null;
          upsertRow({
            ...entry.row,
            reactions: reactedKey ? [{ emoji: '👍', count: 1 }] : [],
          });
        };

        $('w-delete').onclick = () => {
          const entry = lastEntry(() => true);
          if (entry)
            upsertRow({
              ...entry.row,
              deleted: true,
              media: null,
              text: '',
              reactions: [],
            });
        };

        $('reply-to').onclick = () => {
          const entry = lastEntry(() => true);
          if (entry) postCore({ kind: 'reply', chat: CHAT_ID, key: entry.row.key });
        };

        $('plain').onclick = async () => {
          const source = lastMediaEntry();
          const bytes = source?.bytes || (await drawSample(PHOTO_SIDES, PHOTO_FILL));
          const sides = source
            ? source.row.media
            : { w: PHOTO_SIDES.width, h: PHOTO_SIDES.height };
          addServerRow(
            {
              media: {
                kind: 'photo',
                name: 'photo.gif',
                w: sides.w,
                h: sides.h,
                size: bytes.size,
              },
            },
            bytes
          );
        };

        $('reply').onclick = () => {
          const source = lastMediaEntry();
          if (source)
            addServerRow({
              text: t('Ответ на картинку', 'Reply to the picture'),
              replyTo: source.row.key,
            });
        };

        /**
         * История: строки «с сервера» над лентой — текст, стикеры четырёх пропорций с маркером в
         * имени и фото без маркера; лента остаётся у низа.
         */
        $('w-history').onclick = async () => {
          const button = $('w-history');
          button.disabled = true;
          const rows = [];
          for (let index = 0; index < HISTORY_ROWS; index++) {
            const mine = index % 2 === 0;
            if (index % 4 === 1) {
              const [width, height] = HISTORY_SIDES[(index >> 2) % HISTORY_SIDES.length];
              const bytes = await drawSample({ width, height });
              const media = {
                kind: 'photo',
                name: `${index}.amostk.k-sticker.gif`,
                w: width,
                h: height,
                size: bytes.size,
              };
              rows.push([{ mine, media }, bytes]);
            } else if (index % 8 === 3) {
              const bytes = await drawSample(PHOTO_SIDES, PHOTO_FILL);
              const media = {
                kind: 'photo',
                name: 'photo.jpg',
                w: PHOTO_SIDES.width,
                h: PHOTO_SIDES.height,
                size: bytes.size,
              };
              rows.push([{ mine, media }, bytes]);
            } else {
              rows.push([
                {
                  mine,
                  text: `${t('Сообщение истории', 'History message')} ${index + 1}`,
                },
                null,
              ]);
            }
          }
          for (const [fields, bytes] of rows.reverse())
            addServerRow(fields, bytes, { isPrepend: true });
          feed.scrollTop = feed.scrollHeight;
          syncDown();
          button.disabled = false;
        };

        /**
         * Уход в другой чат и возврат: поле и лента монтируются заново, поле — из черновика ядра,
         * картинки строк снова «скачиваются»; правка снимается.
         */
        $('w-reenter').onclick = () => {
          isFeedMounted = false;
          feed.replaceChildren();
          bar.replaceChildren();
          composer = null;
          compose.edit = null;
          $('w-editing').checked = false;
          setTimeout(() => {
            isFeedMounted = true;
            mountComposer();
            for (const key of order) {
              const entry = entries.get(key);
              entry.isImageShown = false;
              renderRow(entry);
              scheduleImage(entry);
            }
            feed.scrollTop = feed.scrollHeight;
            syncDown();
          }, REENTER_MS);
        };

        mountComposer();
        syncDown();
        if (coreMissed.checked) startCore();
        return { startCore };
      };
      const workerHarness = isWorkerMarkup ? mountWorkerHarness() : null;
    </script>
    <script src="../dist/amo-stickers.user.js"></script>
    <script>
      /**
       * Ядро страницы Worker-версии — после userscript, то есть после агента в мире страницы:
       * в живой Worker-версии агент стартует до скриптов страницы.
       */
      workerHarness?.startCore();
    </script>
  </body>
</html>
